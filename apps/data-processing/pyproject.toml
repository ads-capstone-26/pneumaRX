[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pneumarx-data-processing"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pneumarx"]

[project.scripts]
pneumarx-data-processing = "pneumarx_data.main:main"

[tool.setuptools]
packages = ["pneumarx_data"]
package-dir = { "pneumarx_data" = "." }

[tool.uv.sources]
pneumarx = { workspace = true }
